[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "1.0.0"
description = "A reproducible research-impact ranking lab with temporal evaluation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["radar*"]

[project.scripts]
research-radar = "radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
